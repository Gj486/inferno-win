name: Inferno
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Inferno
        shell: bash
        run: git clone --recursive https://github.com/teodly/inferno inferno-src

      - name: Apply Windows patch
        shell: bash
        run: |
          set -e
          mkdir -p inferno-src/usrvclock-rs/src
          cp windows/usrvclock_lib.rs inferno-src/usrvclock-rs/src/lib.rs
          cp windows/usrvclock_Cargo.toml inferno-src/usrvclock-rs/Cargo.toml
          mkdir -p inferno-src/inferno_aoip/src/util
          cat > inferno-src/inferno_aoip/src/util/os.rs << 'EOF2'
          use thread_priority::{Error, ThreadPriority};

          pub fn set_current_thread_realtime(_priority_hint: u8) -> Result<(), Error> {
            thread_priority::set_current_thread_priority(ThreadPriority::Max)
          }
          EOF2
          # mDNS: Windows only delivers multicast replies to a socket bound to 0.0.0.0
          perl -0pi -e 's/IpAddr::V4\(if cfg!\(windows\) && ifaces\.len\(\) == 1 \{\s*\*ifaces\.iter\(\)\.next\(\)\.unwrap\(\)\s*\} else \{\s*Ipv4Addr::UNSPECIFIED\s*\}\)/IpAddr::V4(Ipv4Addr::UNSPECIFIED)/' inferno-src/searchfire/src/socket.rs
          grep -n "IpAddr::V4(Ipv4Addr::UNSPECIFIED)" inferno-src/searchfire/src/socket.rs || (echo "mDNS PATCH FAILED"; exit 1)
          if ! grep -q '^thread-priority' inferno-src/inferno_aoip/Cargo.toml; then
            sed -i '/^\[dependencies\]/a thread-priority = "0.16"' inferno-src/inferno_aoip/Cargo.toml
          fi

      - name: Add DanteBridge
        shell: bash
        run: |
          set -e
          mkdir -p inferno-src/dante_bridge/src
          cp bridge/dante_bridge_Cargo.toml inferno-src/dante_bridge/Cargo.toml
          cp bridge/dante_bridge_main.rs inferno-src/dante_bridge/src/main.rs
          cp bridge/shm.rs inferno-src/dante_bridge/src/shm.rs
          sed -i 's/"inferno2pipe",/"inferno2pipe",\n    "dante_bridge",/' inferno-src/Cargo.toml
          sed -i '/"alsa_pcm_inferno",/d' inferno-src/Cargo.toml

      - name: Unit tests (do not block the build)
        continue-on-error: true
        shell: bash
        working-directory: inferno-src
        run: |
          mkdir -p ../out
          cargo test -p usrvclock 2>&1 | tail -60 | tee ../out/tests.txt

      - name: Build
        shell: bash
        working-directory: inferno-src
        run: |
          mkdir -p ../out
          set +e
          cargo build --release -p dante_bridge > ../full.log 2>&1
          STATUS=$?
          set -e
          grep -A14 "^error" ../full.log | head -300 > ../out/errors.txt || true
          tail -80 ../full.log > ../out/tail.txt || true
          cp target/release/dante_bridge.exe ../out/ || true
          cp ../bridge/firewall.bat ../out/ || true
          if [ $STATUS -ne 0 ]; then
            echo "BUILD FAILED" > ../out/FAILED.txt
            echo "===== ERROR EXTRACT ====="
            cat ../out/errors.txt || true
            echo "===== LAST 80 LINES ====="
            cat ../out/tail.txt || true
            exit 1
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: full.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result
          path: out
