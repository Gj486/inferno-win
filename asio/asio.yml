name: ASIO
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ASIO drivers
        shell: pwsh
        run: |
          cmake -S asio -B asio/build -A x64
          cmake --build asio/build --config Release 2>&1 | Tee-Object -FilePath asio/build.log
      - name: Collect
        if: always()
        shell: bash
        run: |
          mkdir -p out/stageA out/stageB
          cp asio/build/stageA/dante_asio.dll out/stageA/ || true
          cp asio/build/stageB/dante_asio.dll out/stageB/ || true
          cp asio/install.bat asio/uninstall.bat out/stageA/ || true
          cp asio/install.bat asio/uninstall.bat out/stageB/ || true
          grep -i "error" asio/build.log | head -80 > out/errors.txt || true
          tail -15 asio/build.log > out/tail.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asio
          path: out
